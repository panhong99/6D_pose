# get_current_tool_flange_posx, 2026-10-27), object at the old red-plate spot.
# hand_approach = hand pose (tesollo/poses.yaml, 'open' = pose #0) while the arm moves there; hand_grasp = pose before the
# SDK force grasp (dg5fs_sdk.py --object), then lift.
plate:
  posj_deg: [17.95, 38.85, 109.37, -3.79, -57.68, -85.04]
  flange_posx: [752.3, 287.01, 158.95, 21.15, 90.59, -87.04]   # mm, deg (DR_BASE)
  hand_approach: open          # pose #0 all the way down, THEN pose #20 (보스: closing it earlier does not work)
  hand_grasp: plate_pinch20
  read: '2026-10-27 16:0x'
bowl:
