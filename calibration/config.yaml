# Real-robot side: M1013 + 2F-85 + two D455 (fixed, wrist).  Read by calib_core.load_config() in every calibration/ tool.
# Units: metres / degrees unless the key says otherwise.  Relative paths are relative to calibration/.
# Safety limits of the real-robot mover are NOT here: they are constants in ros2_nodes.py (speed <= 2 deg/s).

paths:
  data: data
  m1013_share: /home/pan/pan/doosan_ws/install/dsr_description2/share/dsr_description2
  cell_json: data/real_cell_measured.json          # measured frame / table (overrides robot_model.FRAME_CELL)
  intrinsics: data/real_d455_intrinsics.json       # fixed D455 colour K at 1280x720 (PnP of the fixed camera)
  gripper_dir: ../assets/robotiq_2f85              # mujoco_menagerie Robotiq 2F-85 (sim scene)
  plate_obj: ../demo_data/029_plate/tsdf/textured.obj
  ros_setup: /opt/ros/jazzy/setup.bash
  doosan_setup: ../../doosan_ws/install/setup.bash

robot:
  home_joints_deg: [-5.98, -14.75, 117.74, -3.92, 7.46, -85.07]   # Human home pose (2026-10-02)
  robot_id: dsr01
  controller_ns: dsr_controller2
  host: 192.168.127.100            # controller; this PC needs 192.168.127.5/24 on enp5s0 after a reboot
  port: 12345
  coupling_m: 0.020                # AGC-DOO-KIT-85 flange coupling (Human 2026-10-02)

cameras:
  fixed_serial: "338122300585"
  wrist_serial: "338122303684"
  width: 1280
  height: 720
  fps: 30

udp:                               # all on 127.0.0.1
  fp_pose: 5005                    # real_time_project/main.py -> mesh-to-camera 4x4 + timestamp
  flange: 5006                     # ros2_nodes.py flange -> {posx, posj, t}
  publish: 5010                    # pipeline -> ros2_nodes.py publisher
  viz: 5011                        # pipeline -> ros2_nodes.py viz (RViz plate / plan preview)
  export_server: 5012              # TCP: pipeline -> warm rl/eval.py serve (pipeline.py --export_server)

marker:                            # loose calibration marker (wrist hand-eye + fixed camera)
  id: 1
  dictionary: DICT_4X4_100
  size_m: 0.100                    # nominal print
  scale: 0.98                      # printed / nominal (tape ~98 mm, hand-eye fit 0.977)
  pixels_per_cell: 10              # ArUco bit sampling; OpenCV default 4 missed the oblique 100 mm marker

basket:                            # dish basket pose from 4 ArUco markers on its rim (Human 2026-10-08 16:1x)
  marker_ids: {robot_side: 3, far: 5, handle: 2, back: 4}   # (10/14 16:xx 보스) new 5 cm markers ID 2-5: 3 robot side (x~0.80), 5 far (x~1.33), 2 handle = basket -y, 4 back (+y); was {robot_side: 3, far: 1, handle: 4, back: 2} 9.8 cm
  max_fit_residual_m: 0.010         # (10/14) basket fit gate: 3-marker fits run 7-8 mm (8.1 mm stopped a run); was 0.008 in code
  marker_size_m: 0.050             # (10/14 16:xx 보스) 5 x 5 cm (was 0.098)
  detect_upsample: 2                # (10/14) 2x image + sub-pixel corners for the small markers: 40/40 frames each, xy jitter 0.2-3.4 mm
  n_frames: 20
  layout: data/basket/basket_layout_5cm_20261019_164625_relayout.json   # (10/19 16:5x: blocks 3 and 5 had moved ~2 cm, every fit > 10 mm; markers re-stored in the 16:28 Q3 basket frame)
  # was: layout: data/basket/basket_layout_5cm_20261016_140249.json   # (10/16 14:02 보스) markers re-mounted on flat plates + basket moved: frame from wrist tine fit, fixed calib 20261016_134701_fromwrist_drop3
  # was: layout: data/basket/basket_layout_5cm_20261014_160915.json   # (10/14 16:09) 5 cm markers ID 2-5 in the basket frame of 14:45 (basket not moved): 3 runs fit 0.1-0.3 mm, pose repeat 0.1 mm / 0.02 deg (was basket_layout_20261012_133410.json, 9.8 cm markers, fit 7-8 mm)
  fixed_z_m: 0.144                  # (10/19 보스: basket 17.5 cm overall, tines 6 cm, fixed on the table) basket frame height used for every run
                                    # instead of the marker fit (10/19 fits 0.125 / 0.131 / 0.143 -> the insert went up to 1.9 cm deeper); 10/8 measured 0.1442, teach 0.1442
  fixed_z_tol_m: 0.03               # a marker fit farther than this from fixed_z_m stops the run before motion
  reuse_last_good_min: 30            # (10/19 보스) with plates standing in the basket a failed marker fit reuses the last 4-marker pose this young
  marker_blocks: {size_m: 0.14, height_m: 0.10, above_m: 0.01}   # (10/16 보스: Q4 pin 4 hit a marker plate) each marker block + its bolts (they reach into the basket) as a collision box: 14 cm square around the marker centre, 1 cm above it down 10 cm. With it Q3 pins 4-5 have no insert plan and Q3 7 fails 83 % with sim sag (marker 4); targets Q3/Q4 8 and 11

capture:                           # one sample = n_frames marker poses averaged while the robot is still
  n_frames: 20
  still_s: 1.5
  still_mm: 0.3
  still_deg: 0.1

wrist:                             # eye-in-hand T_flange_cam (calibrate.py wrist)
  max_jitter_mm: 1.0
  min_tilt_deg: 15.0
  min_dist: 0.3
  max_dist: 0.7                    # solve filter used for the 2026-10-06 result (14 of 19 samples); capture beyond it is ignored
  min_new_mm: 20.0
  min_new_deg: 8.0
  target_samples: 20

fixed:                             # fixed-camera T_base_cam from wrist-located markers (calibrate.py fixed)
  max_jitter_mm: 2.0
  min_tilt_deg: 10.0

gt_compare:                        # FoundationPose x T_base_cam vs wrist-GT marker on the cube (calibrate.py gt)
  marker_id: 1
  marker_size_m: 0.045
  dictionary: DICT_4X4_50
  cube_edge_m: 0.057
  max_jitter_mm: 1.0
  min_tilt_deg: 10.0

stability:                         # FoundationPose stream: last n poses must agree
  n: 8
  mm: 3.0
  deg: 3.0

planner:                           # pipeline.py: top-down pregrasp above the cube, collision-checked joint path
  margin_m: 0.10
  pregrasp_height_m: 0.10
  tool_length_m: 0.0               # Human decision pending (gripper not yet modelled in the real plan)
  tool_radius_m: 0.05
  reach_m: [0.25, 1.25]
  z_m: [-0.03, 0.15]
  max_segment_deg: 45.0
  prompt: "rubik's cube"
  conf: 0.15
  timeout_s: 180.0

gripper:                           # Robotiq 2F-85 via USB-RS485 (FTDI) on this PC; gripper.py (system Python + pyserial)
  port: /dev/ttyUSB0
  slave: 9
  baud: 115200
  force: 64                        # 0..255 (1/4 of max, Human 2026-10-07); speed is always the slowest (hard-coded in gripper.py)

white_plate:                       # (10/16 보스) pipeline.py --plate_color white: same YCB 029 shape (보스: size ~same, slightly thinner)
  prompt: white plate              # YOLOE picks the white plate, not the red one next to it (checked 10/16 13:0x, FP score 83-86)
  obj: ../demo_data/029_plate_white/tsdf/textured.obj   # copy of 029_plate obj/mtl (not symlinks: paths are resolved), textured.png recoloured white; FP score 84 reg / 87-88 track
  grasp_deeper_m: 0.010            # (10/16 보스 '좀 더 깊게') added to the radial grasp offset: TCP 1 cm further onto the plate (grasp is on the near rim, tool along +radial)
  grip_force: 128                  # (10/16 보스 'red보다 압력 2배') gripper close force 0..255 (red: gripper.force 64)

plate_rl:                          # pipeline.py --task plate: FoundationPose plate -> plan -> supervised legs (history: collab/DECISIONS.md)
  isaaclab: /home/pan/IsaacLab/isaaclab.sh
  checkpoint: /home/pan/IsaacLab/logs/rsl_rl/m1013_2f85_il_residual/2026-10-07_15-15-44_stage2/model_400.pt   # old BC+RL (--plate_policy rl)
  residual_base: /home/pan/IsaacLab/logs/rsl_rl/m1013_2f85_rim_slow/2026-10-07_14-05-09_stage2_bc/model_0.pt   # its BC actor
  prompt: red plate
  tolerance_mm: [25.0, 25.0, 15.0]   # |x|, |y|, |z| of the plate root from the trained spot (no-library mode)
  max_tilt_deg: 8.0                  # FoundationPose shows ~4 deg on a flat plate (bias)
  placement_timeout_s: 600           # time to place the plate inside the trained area
  offset_m: [0.0025, 0.055]          # added to the FP plate root before planning (x radial, y tangential); tuned on the real robot 10/7-10/12
  start_tolerance_deg: 3.0           # robot must be this close to the home joints
  keep_perception: true              # FoundationPose window keeps tracking during the motion (pose logged with the joints)
  export_envs: 8                     # sim rollouts per plan (GPU shared with FoundationPose)
  vel_deg_s: 45.0                    # (10/19 보스: 30 -> +15; 10/13 보스: 40 -> a bit slower) every leg except the plate's way down (grasp, lift, carry, ascend, home, aborts); mover has no upper limit
  auto_merged_legs: true             # (10/13 보스) --auto --insert policy: 4 splines (to_grasp | lift+to_above | policy start+insert | ascend+home), stops only for the gripper
  transport_step_deg: 20.0           # (10/13) waypoint spacing of those legs, like the grasp leg (2-deg steps ran ~2x slower)
  hold_s: 3.0                        # pause with the plate lifted

plate_ik_bc:                       # --plate_policy ik_bc (overrides plate_rl keys)
  checkpoint: /home/pan/IsaacLab/logs/rsl_rl/m1013_goal1_union_claude_20261008_seed2/2026-10-08_17-38-42_stage2_bc/model_0.pt   # union BC (93.6 %)
  residual_base: null              # no RL residual
  approach: ik                     # straight TCP line from ready to the rim, BC takes over within handoff_m
  handoff_m: 0.04
  approach_fast_sim: 4.0           # plan rollout only: IK line faster in sim (real robot still 6 deg/s)
  library: data/plan_library/20261008_174557_380970/library.npz   # union BC library, 1645/1672 sim ok
  max_azimuth_deg: 60              # plate direction from the base +x axis
  tool_length_m: 0.165             # flange -> 2F-85 pinch point (FK cell clearance)
  tool_radius_m: 0.06
  # basket insertion (golden teaching corrected; tuned on the real robot 10/12, see collab/DECISIONS.md)
  golden_teach: data/teach/golden/full_01_best_20261008_1504.json   # best full teaching (10/8)
  basket_shift_m: [0.0, -0.076, 0.0]   # --place golden: basket vs the teaching (also drawings / RViz)
  basket_nudge_m: [0.005, 0.0, 0.0]    # plate path tweak
  basket_yaw_deg: 14.7                 # slot path turned about the vertical at the insert (plate along the pin rows)
  basket_tilt_deg: 15.0                # plate top toward +x at the insert so it slides in (0 = taught tilt)
  basket_tilt_x_comp_m: 0.04           # with the tilt: +x along the pin rows (it landed 2 pins short)
  basket_transit_lift_m: [0.13, 0.10, 0.07]   # above higher than taught: the highest the arm reaches
  basket_carry_lift_m: 0.15            # carry (flat plate over the wall) higher than taught
  basket_carry_rise_m: 0.30            # (10/19 보스: 15 -> 45 -> 30 cm, 45 hit joint limits on the rise; 10/18: plates hit the marker plates on the low RRT carry) quadrant insert: straight up until the
                                       # plate is >= 15 cm above its grasp height, across at that height, straight down onto the above pose
                                       # (null = old straight/RRT carry)
  basket_carry_clear_m: 0.05           # and >= 5 cm over the marker blocks
  basket_carry_plate_clear_m: 0.05     # and >= 5 cm over a plate already standing in the basket (its top ~15 cm over the rim). Pin 8 after
                                       # pin 10: the straight-down start (~20 cm over the rim) is out of reach for the usual insert pose (phi 0),
                                       # the planner takes phi -20/-30 (10/18); 3 cm does not change that
  basket_pre_up_m: 0.075               # look stop: TCP this far above the taught insert
  basket_insert_up_m: 0.020            # insert end this far above the taught insert
  basket_retreat_up_m: 0.08            # tilted: after release straight up (the highest that reaches, >= 3 cm)
  basket_pre_vel_deg_s: 4.0            # first descent: above -> pre / policy start (10/13 보스: 5.25 -> a bit slower)
  basket_insert_vel_deg_s: 1.2         # taught insert, in the pins (10/13 보스: 1.6 -> a bit slower)
  basket_policy_bc: ../rl/logs/basket/bc_data_basket_v3_20261012/seed3_20261012_215747/best.pt   # --insert policy (10/13)
  basket_policy_rl: ../rl/logs/basket/rl_20261013_003636/best.pt   # residual RL on it: sim 0.913 vs BC 0.786 (1,024 ep)
  basket_policy_range: {x: [1.02, 1.22], y: [-0.39, -0.19], y_sim_checked: [-0.39, 0.20], yaw_deg: [-14, 16]}   # RL start states (10/13); y up to +0.20 only sim-checked
  basket_policy_vel_deg_s: 5.0         # policy start + insert (merged spline) (10/13 보스: 7.0 -> a bit slower)
  basket_quadrant_vel_deg_s: 7.0       # --insert quadrant: straight-down insert (10/19 보스: 3.5 -> 7; 10/13 19:5x 보스: 5.0 -> a bit slower)
  basket_quadrant_sim_real_dh_m: 0.020   # (10/19 14:xx 보스 "지금도 조금 깊어" +1 cm, with the basket height fixed at 0.144; 10/15 17:1x 보스 실기 "1 cm 덜 깊게" 0.010) --sim_q: real-robot release height = sim centre_h + this
  basket_quadrant_model_dx_m: {Q4: 0.007}   # (10/19 17:0x 보스: +15 mm went too far +x -> half; 16:4x 보스: Q4 pin 6 went in L3/R2 at 0) --sim_q: model gap x -> measured, from the v4 tine labels
                                       # (Codex BL bl_model_fit_20261019_v3/pin_centres.csv: Q4 model - measured -13..-22 mm, pin 6 -15.1 mm; Q3 within 2 mm)
  basket_insert_wall_margin_m: 0.005   # (10/19) wall/marker margin for the straight-down insert only (carry keeps basket_wall_margin_m 1 cm): with Q3 +0.5 cm the rim is ~10 mm from the wall and a 3-marker fit refused every pin at 9.9 mm
  basket_quadrant_sim_real_dy_m: {Q3: 0.005}   # (10/19 14:xx 보스 "조금 더 왼쪽" -> back to +0.5 cm; at 0 for one run. +0.5 leaves the rim ~10 mm from the +y wall, so the insert wall margin is 5 mm below) (10/15 18:3x: +1.5 cm hit the wall check (clearance 0.5); 17:2x 보스 asked +1.5) --sim_q: extra basket-y (+ = left) on top of the automatic wall shift (Q3 -3.0 cm)
  basket_quadrant_centre_h_m: 0.165    # --insert quadrant: plate centre above the basket floor at the end (10/13 보스 0.18 too deep -> 0.21; 10/14 -2.5 cm -> 0.185; 10/14 11:2x 보스 -2 cm)
  basket_region_min_spacing: 4        # (10/19 보스) --region: a new plate at least this many pins from one already in the quadrant (red at 10 -> white <= 6; 2 put the white at 9)
  basket_quadrant_x_trim_m: -0.020     # (10/14 실기) plate landed 1.9 cm (11:5x, pin 7 -> 6-7) and ~3 cm (10:3x) farther than planned
  basket_quadrant_tilt_trim_deg: 0.0   # --insert quadrant: plate leaned along the pin rows at the insert, + = top toward the far side
  basket_quadrant_yaw_trim_deg: 0.0    # --insert quadrant: plate face turned about the vertical at the insert, + = CCW from above (tune on the real robot)
  basket_policy_extra_down_m: 0.005    # (10/13 보스 "조금 더 깊이") after the policy descent, 5 mm straight down before the release
  basket_slot_shift_pitches: 2         # real intended gap = sim slot origin + 2 pins (P1 replay 10/12)
  auto_max_plate_move_mm: 15.0         # --auto: do not close if FP saw the plate move more than this since planning
  workspace_mm: {x: [-80, 140], y: [-180, 180], z: [-15, 15]}   # FP + offset - rl plate_xy (no-library mode)

basket_quadrant_sim:               # (10/15 night, Claude) Isaac per-quadrant insert settings, no in-hand sensing (sim seated & exact 0.953 / 0.952,
                                   # LOG 10/15 02:5x). CANDIDATES for an RViz preview (plate_plans.py quadrant_plans --sim_q); not approved for the robot.
                                   #   lean = factor of the quadrant's tine lean at the release, aim_m = basket-x shift of the target, flip = wrist flipped
  Q1: {flip: true,  lean: 0.5,  aim_m: 0.029,   centre_h: 0.165}
  Q2: {flip: true,  lean: 0.0,  aim_m: 0.038,   centre_h: 0.165}
  Q3: {flip: false, lean: -0.5, aim_m: -0.0384, centre_h: 0.165}
  Q4: {flip: false, lean: 0.5,  aim_m: -0.035,  centre_h: 0.165}
