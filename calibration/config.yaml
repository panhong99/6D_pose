# Real-robot side: M1013 + 2F-85 + two D455 (fixed, wrist).  Read by calib_core.load_config() in every calibration/ tool.
# Units: metres / degrees unless the key says otherwise.  Relative paths are relative to calibration/.
# Safety limits of the real-robot mover are NOT here: they are constants in ros2_nodes.py (speed <= 2 deg/s).

paths:
  data: data
  m1013_share: /home/pan/pan/doosan_ws/install/dsr_description2/share/dsr_description2
  cell_json: data/real_cell_measured.json          # measured frame / table (overrides robot_model.FRAME_CELL)
  intrinsics: data/real_d455_intrinsics.json       # fixed D455 colour K at 1280x720 (PnP of the fixed camera)
  gripper_dir: ../assets/robotiq_2f85              # mujoco_menagerie Robotiq 2F-85 (sim scene)
  plate_obj: ../demo_data/029_plate/tsdf/textured.obj
  ros_setup: /opt/ros/jazzy/setup.bash
  doosan_setup: ../../doosan_ws/install/setup.bash

robot:
  home_joints_deg: [-5.98, -14.75, 117.74, -3.92, 7.46, -85.07]   # Human home pose (2026-10-02)
  robot_id: dsr01
  controller_ns: dsr_controller2
  host: 192.168.127.100            # controller; this PC needs 192.168.127.5/24 on enp5s0 after a reboot
  port: 12345
  coupling_m: 0.020                # AGC-DOO-KIT-85 flange coupling (Human 2026-10-02)

cameras:
  fixed_serial: "338122300585"
  wrist_serial: "338122303684"
  width: 1280
  height: 720
  fps: 30

udp:                               # all on 127.0.0.1
  fp_pose: 5005                    # real_time_project/main.py -> mesh-to-camera 4x4 + timestamp
  flange: 5006                     # ros2_nodes.py flange -> {posx, posj, t}
  publish: 5010                    # pipeline -> ros2_nodes.py publisher
  viz: 5011                        # pipeline -> ros2_nodes.py viz (RViz plate / plan preview)
  export_server: 5012              # TCP: pipeline -> warm rl/eval.py serve (pipeline.py --export_server)

marker:                            # loose calibration marker (wrist hand-eye + fixed camera)
  id: 1
  dictionary: DICT_4X4_100
  size_m: 0.100                    # nominal print
  scale: 0.98                      # printed / nominal (tape ~98 mm, hand-eye fit 0.977)
  pixels_per_cell: 10              # ArUco bit sampling; OpenCV default 4 missed the oblique 100 mm marker

basket:                            # dish basket pose from 4 ArUco markers on its rim (Human 2026-10-08 16:1x)
  marker_ids: {robot_side: 3, far: 1, handle: 4, back: 2}   # robot side x~0.97, far side x~1.49, blue handle y~+0.01
  marker_size_m: 0.098             # same print as the calibration marker (depth estimate ~95 mm); ID 1 = calibration ID!
  n_frames: 20
  layout: data/basket/basket_layout_20261012_133410.json   # 10/12 14:xx re-fixed markers (was basket_layout_20261012_131751.json); 13:2x markers re-taped: --define_current (today's basket = teaching frame + basket_shift_m); was data/basket/basket_layout.json

capture:                           # one sample = n_frames marker poses averaged while the robot is still
  n_frames: 20
  still_s: 1.5
  still_mm: 0.3
  still_deg: 0.1

wrist:                             # eye-in-hand T_flange_cam (calibrate.py wrist)
  max_jitter_mm: 1.0
  min_tilt_deg: 15.0
  min_dist: 0.3
  max_dist: 0.7                    # solve filter used for the 2026-10-06 result (14 of 19 samples); capture beyond it is ignored
  min_new_mm: 20.0
  min_new_deg: 8.0
  target_samples: 20

fixed:                             # fixed-camera T_base_cam from wrist-located markers (calibrate.py fixed)
  max_jitter_mm: 2.0
  min_tilt_deg: 10.0

gt_compare:                        # FoundationPose x T_base_cam vs wrist-GT marker on the cube (calibrate.py gt)
  marker_id: 1
  marker_size_m: 0.045
  dictionary: DICT_4X4_50
  cube_edge_m: 0.057
  max_jitter_mm: 1.0
  min_tilt_deg: 10.0

stability:                         # FoundationPose stream: last n poses must agree
  n: 8
  mm: 3.0
  deg: 3.0

planner:                           # pipeline.py: top-down pregrasp above the cube, collision-checked joint path
  margin_m: 0.10
  pregrasp_height_m: 0.10
  tool_length_m: 0.0               # Human decision pending (gripper not yet modelled in the real plan)
  tool_radius_m: 0.05
  reach_m: [0.25, 1.25]
  z_m: [-0.03, 0.15]
  max_segment_deg: 45.0
  prompt: "rubik's cube"
  conf: 0.15
  timeout_s: 180.0

gripper:                           # Robotiq 2F-85 via USB-RS485 (FTDI) on this PC; gripper.py (system Python + pyserial)
  port: /dev/ttyUSB0
  slave: 9
  baud: 115200
  force: 64                        # 0..255 (1/4 of max, Human 2026-10-07); speed is always the slowest (hard-coded in gripper.py)

plate_rl:                          # pipeline.py --task plate: FoundationPose plate -> plan -> supervised legs (history: collab/DECISIONS.md)
  isaaclab: /home/pan/IsaacLab/isaaclab.sh
  checkpoint: /home/pan/IsaacLab/logs/rsl_rl/m1013_2f85_il_residual/2026-10-07_15-15-44_stage2/model_400.pt   # old BC+RL (--plate_policy rl)
  residual_base: /home/pan/IsaacLab/logs/rsl_rl/m1013_2f85_rim_slow/2026-10-07_14-05-09_stage2_bc/model_0.pt   # its BC actor
  prompt: red plate
  tolerance_mm: [25.0, 25.0, 15.0]   # |x|, |y|, |z| of the plate root from the trained spot (no-library mode)
  max_tilt_deg: 8.0                  # FoundationPose shows ~4 deg on a flat plate (bias)
  placement_timeout_s: 600           # time to place the plate inside the trained area
  offset_m: [0.0025, 0.055]          # added to the FP plate root before planning (x radial, y tangential); tuned on the real robot 10/7-10/12
  start_tolerance_deg: 3.0           # robot must be this close to the home joints
  keep_perception: true              # FoundationPose window keeps tracking during the motion (pose logged with the joints)
  export_envs: 8                     # sim rollouts per plan (GPU shared with FoundationPose)
  vel_deg_s: 6.0                     # joint speed and accel of the smooth legs (cap 6, Human-approved)
  vel_transport_deg_s: 12.0          # (10/13 보스 "3/10 -> 6/10") legs before the descent: to_grasp, lift, to_above (mover cap 12)
  hold_s: 3.0                        # pause with the plate lifted

plate_ik_bc:                       # --plate_policy ik_bc (overrides plate_rl keys)
  checkpoint: /home/pan/IsaacLab/logs/rsl_rl/m1013_goal1_union_claude_20261008_seed2/2026-10-08_17-38-42_stage2_bc/model_0.pt   # union BC (93.6 %)
  residual_base: null              # no RL residual
  approach: ik                     # straight TCP line from ready to the rim, BC takes over within handoff_m
  handoff_m: 0.04
  approach_fast_sim: 4.0           # plan rollout only: IK line faster in sim (real robot still 6 deg/s)
  library: data/plan_library/20261008_174557_380970/library.npz   # union BC library, 1645/1672 sim ok
  max_azimuth_deg: 60              # plate direction from the base +x axis
  tool_length_m: 0.165             # flange -> 2F-85 pinch point (FK cell clearance)
  tool_radius_m: 0.06
  # basket insertion (golden teaching corrected; tuned on the real robot 10/12, see collab/DECISIONS.md)
  golden_teach: data/teach/golden/full_01_best_20261008_1504.json   # best full teaching (10/8)
  basket_shift_m: [0.0, -0.076, 0.0]   # --place golden: basket vs the teaching (also drawings / RViz)
  basket_nudge_m: [0.005, 0.0, 0.0]    # plate path tweak
  basket_yaw_deg: 14.7                 # slot path turned about the vertical at the insert (plate along the pin rows)
  basket_tilt_deg: 15.0                # plate top toward +x at the insert so it slides in (0 = taught tilt)
  basket_tilt_x_comp_m: 0.04           # with the tilt: +x along the pin rows (it landed 2 pins short)
  basket_transit_lift_m: [0.13, 0.10, 0.07]   # above higher than taught: the highest the arm reaches
  basket_carry_lift_m: 0.15            # carry (flat plate over the wall) higher than taught
  basket_pre_up_m: 0.075               # look stop: TCP this far above the taught insert
  basket_insert_up_m: 0.020            # insert end this far above the taught insert
  basket_retreat_up_m: 0.08            # tilted: after release straight up (the highest that reaches, >= 3 cm)
  basket_pre_vel_deg_s: 1.5            # above -> pre and back
  basket_insert_vel_deg_s: 0.25        # in the pins
  basket_ascend_vel_deg_s: 1.5         # after release
  basket_policy_bc: ../rl/logs/basket/bc_data_basket_v3_20261012/seed3_20261012_215747/best.pt   # --insert policy (10/13)
  basket_policy_rl: ../rl/logs/basket/rl_20261013_003636/best.pt   # residual RL on it: sim 0.913 vs BC 0.786 (1,024 ep)
  basket_policy_range: {x: [1.02, 1.22], y: [-0.39, -0.19], y_sim_checked: [-0.39, 0.20], yaw_deg: [-14, 16]}   # RL start states (10/13); y up to +0.20 only sim-checked
  basket_policy_vel_deg_s: 1.2         # policy_descend (10/13 보스: 0.4 far too slow -> x3); ~6 mm/s TCP, ~15-20 s
  basket_slot_shift_pitches: 2         # real intended gap = sim slot origin + 2 pins (P1 replay 10/12)
  auto_max_plate_move_mm: 15.0         # --auto: do not close if FP saw the plate move more than this since planning
  workspace_mm: {x: [-80, 140], y: [-180, 180], z: [-15, 15]}   # FP + offset - rl plate_xy (no-library mode)
