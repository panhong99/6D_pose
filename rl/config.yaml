# M1013 + Robotiq 2F-85: side-rim grasp of the 029 plate (Isaac Lab, PPO / rsl_rl).
# Every number used by plate_env.py / train.py / eval.py / env_setup.py lives here.
# Units: metres, radians unless the key says _deg.  Frames: robot base, +x toward the steel frame, +y robot-left, z up.

paths:                                    # relative paths are relative to rl/
  isaaclab: ~/IsaacLab
  log_root: ~/IsaacLab/logs/rsl_rl        # checkpoints: <log_root>/<experiment>/<date>_stage<k>/model_<it>.pt
  experiment: m1013_2f85_il_residual_wide_stable # fresh run; prior wide run is preserved
                                          # (m1013_2f85_rim = v10 fast policy, 2026-10-06; rejected for speed 2026-10-07)
  robot_urdf: assets/m1013_2f85.urdf
  plate_usd: assets/plate029_textured.usda           # physics from plate029.usd + original textured visual
  plate_physics_usd: assets/plate029.usd
  plate_obj_simplified: assets/plate029_simplified.obj
  plate_obj_textured: ../demo_data/029_plate/tsdf/textured.obj
  cell_sdf: assets/cell_sdf.npz
  ready_joints: assets/ready_joints.json
  m1013_share: /home/pan/pan/doosan_ws/install/dsr_description2/share/dsr_description2
  gripper_mjcf_dir: ../assets/robotiq_2f85
  calibration_dir: ../calibration

robot:
  home_deg: [-5.98, -14.75, 117.74, -3.92, 7.46, -85.07]   # Human home pose (calibration/kinematics.HOME_JOINTS_DEG)
  coupling_m: 0.020                       # AGC-DOO-KIT-85 flange coupling (Human 2026-10-02)
  finger_stroke: 0.0425                   # prismatic jaw travel, 0 = open (85 mm), 0.0425 = closed
  actuators:                              # implicit PD; gravity is disabled on the robot links
    arm_big:   {joints: "joint_[1-3]", effort: 346.0, velocity: 2.0, stiffness: 10000.0, damping: 1000.0}
    arm_small: {joints: "joint_[4-6]", effort: 50.0,  velocity: 3.9, stiffness: 2500.0,  damping: 250.0}
    gripper:   {joints: ".*_finger_joint", effort: 235.0, velocity: 0.02, stiffness: 2000.0, damping: 100.0}   # 20 mm/s = real 2F-85 slowest

geometry:
  table_top_z: -0.020
  box_h: 0.1146                           # plate support: plate top ~14 cm above the table (Human 2026-10-06)
  box_xy: 0.08
  plate_xy: [1.10, 0.0]                   # real plate measured at (1.215, -0.009): NOT applied yet
  target_xy: [1.10, -0.45]
  plate_reset_xy: 0.01                    # +- uniform plate shift at reset (yaw is random 0..2pi); used when the two below are absent
  plate_reset_x: [-0.06, 0.06]            # wide range (2026-10-07 night): the real plate goes where FoundationPose sees it
  plate_reset_y: [-0.08, 0.08]
  plate_mass: 0.30                        # ASSUMED, baked into plate029.usd by env_setup.py plate
  rim_r: 0.128                            # rim circle radius / height above the plate bottom (scan)
  rim_dz: 0.016
  grasp_inset: 0.015                      # rim target moved this far toward the plate centre (deeper grasp, Human GUI)
  ready_offset: [-0.160, -0.080, 0.041038094508]        # ready TCP point relative to the plate root
  rim_offset: [-0.093269058948, -0.087663462417]        # rim point (xy) relative to the plate root, before the inset
  ready_tool_z: [0.930899055477, -0.106905579532, -0.349282329321]
  ready_finger_axis: [-0.345298586772, 0.054353027066, -0.936917624139]   # TCP +y (finger closing axis)

task:
  sim_dt: 0.008333333333                  # 120 Hz physics, decimation 4 -> 30 Hz policy
  decimation: 4
  episode_s: {2: 20.0, 3: 30.0}           # longer: the arm is capped at 5 cm/s
  lift_ok: 0.05                           # "lifted" = plate root >= 5 cm above its rest height
  hold_steps: 150                         # stage 2 success: lifted + level for 5 s
  release_dwell_steps: 30                 # stage 3 success: released for 1 s
  max_hold_tilt_deg: 25.0
  hold_max_plate_speed: 0.03              # stage 2 hold counts only while the plate moves < 3 cm/s (no bobbing)
  lift_target: 0.10                       # lift / tcp_rise rewards saturate here ...
  lift_band: 0.02                         # ... and over_lift penalises plate lift above target + band
  finger_stall: [0.5, 0.97]               # closure ratio while "held": closed on something, not fully shut
  held_circle_tol: 0.03                   # TCP within this of the rim circle in the plate frame
  grasp_tol: {dist: 0.015, tool_deg: 20.0, finger_deg: 25.0}
  plate_obs_noise: 0.001                  # +- uniform per step (was 0.005; real FP jitter 0.4-1.1 mm std while approaching, 2026-10-07)
  obs_rim_rel: true                       # 46-dim obs: + (rim target - TCP); 43-dim checkpoints are detected and built without it
  plate_moved_tol: 0.02                   # "knocked" if the unheld plate moved this far from its reset spot

action:
  # SPEED FIRST (Human 2026-10-07: slowest speed is the top priority, above success).  Caps act inside the env during
  # training, so the policy learns the slow dynamics (inference-only slow-down of the fast v10 policy failed).
  max_tcp_speed: 0.05                     # m/s, rate limit of the held TCP target
  max_rot_speed_deg: 10.0                 # deg/s, rate limit of the commanded TCP rotation (incl. orientation lock)
  scale: 0.0025                           # policy output 1.0 = 2.5 mm / 0.0025 rad per 30 Hz step (7.5 cm/s before the cap)
  hold_windup: 0.01                       # integrated TCP target may lead the real TCP by at most 1 cm
  orientation_lock: {dist: 0.035, tool_deg: 20.0, finger_deg: 25.0}

shield:                                   # voxel distance-field keep-out, checked on every IK joint target
  frame_margin: 0.05
  table_margin: 0.02
  gripper_surface_voxel: 0.003
  sdf_res: 0.01
  sdf_lo: [-0.6, -0.9, -0.15]
  sdf_hi: [1.8, 0.9, 1.7]
  points_per_link: 200

physx:
  bounce_threshold_velocity: 0.2
  friction_correlation_distance: 0.00625
  gpu_found_lost_aggregate_pairs_capacity: 16777216
  gpu_total_aggregate_pairs_capacity: 1048576    # 16k overflowed with 4096 envs (2026-10-03 hang)
  plate_friction: [1.0, 0.9]              # static, dynamic (plate and finger pads)

# Reward terms: name: [weight, params].  Isaac Lab multiplies each by dt (1/30 s), so a weight is "points per second".
rewards:
  stage2:
    reach:              [0.5, {std: 0.2}]           # stay near the ready point (1 - tanh(d / std))
    tool:               [0.5, {}]                   # cos^2 of the tool-axis error
    finger:             [0.5, {}]                   # cos^2 of the finger-axis error
    tool_angle:         [1.5, {key: tool_match, std_deg: 20.0}]
    finger_angle:       [1.5, {key: finger_match, std_deg: 20.0}]
    grasp_reach:        [2.0, {std: 0.035}]         # toward the rim target
    grasp_reach_coarse: [1.0, {std: 0.10}]
    open_before_grasp:  [-0.5, {}]
    close_at_grasp:     [1.0, {}]
    lift:               [3.0, {}]                   # held x plate lift / lift_target (saturates)
    tcp_rise:           [3.0, {}]                   # held x TCP rise since the grasp / lift_target (saturates)
    over_lift:          [-3.0, {}]                  # held x (lift - target - band) / 5 cm, clipped 0..2
    level_hold:         [1.0, {}]                   # lifted x plate-up z^2
    hold_still:         [-2.0, {}]                  # plate in/above the band x plate speed / 3 cm/s, clipped 0..3
    held_speed:         [-1.0, {}]                  # held x (TCP speed / max_tcp_speed)^2
    held_accel:         [-0.5, {}]                  # held x (TCP accel / 1 m/s^2)^2, clipped 0..4
    hold_progress:      [3.0, {}]                   # stable_lift (held, up, level, still) per second: spreads the success value
    success:            [15000.0, {}]               # x dt = +500 once: with gamma 0.998 the shaping while holding (~17/s)
                                                    # is worth ~280 if the episode continues; success must beat it
    shield:             [-1.0, {}]
    collision:          [-1500.0, {}]               # x dt = -50, episode ends
    dropped:            [-1500.0, {}]               # x dt = -50 once when plate_lost ends the episode (was free)
    knocked:            [-3.0, {}]
    action_rate:        [-0.01, {}]
    joint_vel:          [-0.001, {}]
  residual:                                         # used INSTEAD of stage2 when residual.enabled (BC gives the motion)
    # Only sparse task terms + costs.  With positive per-second shaping (lift, level, hold ~10/s) and success ending the
    # episode, PPO learned to stay just short of success and farm the shaping until timeout (98 % -> 0 %, 2026-10-07).
    success:            [3000.0, {}]                # x dt = +100 once
    hold_progress:      [1.0, {}]                   # small: +1/s while stable_lift
    held_drift:         [-3.0, {scale_m: 0.01, max_scale: 40.0}] # linear penalty through 40 cm; no early flat region
    over_lift:          [-3.0, {}]
    hold_still:         [-2.0, {}]
    held_speed:         [-1.0, {}]
    held_accel:         [-0.5, {}]
    shield:             [-1.0, {}]
    collision:          [-1500.0, {}]               # x dt = -50
    dropped:            [-1500.0, {}]
    knocked:            [-3.0, {}]
    action_rate:        [-0.01, {}]
    joint_vel:          [-0.001, {}]
  stage3:                                           # added on top of stage2 (same name = override)
    carry:              [2.0, {std: 0.25}]
    carry_fine:         [2.0, {std: 0.03}]
    lower:              [3.0, {}]
    release:            [3.0, {}]
    success:            [9000.0, {}]

ppo:
  num_steps_per_env: 24
  save_interval: 100
  actor_hidden_dims: [512, 256, 128]
  critic_hidden_dims: [512, 256, 128]
  init_noise_std: 1.0
  entropy_coef: 0.003
  learning_rate: 1.0e-4
  num_learning_epochs: 5
  num_mini_batches: 4
  gamma: 0.998                            # was 0.98 (horizon ~1.7 s): at 5 cm/s success comes 8-13 s after the start,
                                          # 0.98^300 ~ 0.002 -> "do not move" was optimal (collapse 2026-10-07)
  lam: 0.95
  desired_kl: 0.005                       # was 0.01; smaller policy steps (collapse after each success rise)
  clip_param: 0.2
  max_grad_norm: 1.0
  seed: 42

bc:                                       # train.py bc: IL demonstrations -> PPO actor start point (IL -> RL)
  data: [../IL/data_slow_claude]          # state-based expert only (data_slow_codex switches phases on a timer: ambiguous BC labels)
  steps: 4000
  batch: 4096
  lr: 1.0e-3
  weight_decay: 1.0e-5
  ignore_obs: [[8, 16], [36, 43]]         # joint velocities + previous action, hidden from BC (copycat problem)
  obs_scale: [[43, 46, 20.0]]             # rim_rel (m) x 20 while training, folded into the first layer (46-dim obs only)
  phase_weight: 3.0                       # approach/close frames sampled 3x (phase < 2 in the demos)
  init_std: 0.2                           # PPO action noise after BC (low: do not wash out the demonstrated motion)

residual:                                 # IL -> RL: PPO learns a correction on a frozen BC actor (make_vecenv)
  enabled: true                           # (was false 17:22-17:50 for the pure-RL gamma 0.998 baseline, stopped by the Human)
  base: "/home/pan/IsaacLab/logs/rsl_rl/m1013_2f85_rim_slow/2026-10-07_20-20-51_stage2_bc/model_0.pt"   # qualified wide BC
  scale: 0.3                              # executed = base + scale * ppo_action (policy units)
  init_std: 0.3                           # PPO noise on the residual (x scale = 0.09 executed)
  ppo: {entropy_coef: 0.0, schedule: fixed, learning_rate: 2.0e-5}

tracking:
  enabled: true                          # TensorBoard is always retained; W&B receives scalars only
  project: plate_place_KIMM
  entity: null                           # default logged-in account/team
  mode: auto                             # online if authenticated, otherwise offline; WANDB_MODE overrides

curriculum:
  num_envs: 4096
  chunk: 500                              # iterations per Isaac process
  max_iters: 15000                        # per stage
  proxy_gate: 0.5                         # training proxy is advisory; deterministic gate runs each chunk
  rollback_drop: 0.2                      # next chunk resumes from the chunk's best checkpoint if the last one is this much worse
  gate: 0.95                              # deterministic eval success needed to pass a stage
  min_success: 0.90                       # stop if a residual chunk falls below this deterministic success floor
  max_regression: 0.05                    # or >5 percentage points below the evaluated BC baseline
  eval_envs: 2048
  watchdog_s: 900                         # kill a run whose log stops growing (2026-10-03 PhysX hang)
  retries: 3
